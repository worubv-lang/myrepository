<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            fetch('https://goweather.xyz/v2/weather/Seoul')
            .then((response) => response.json())
            .then((data) => {
                document.write("서울 기온은"+ data['temperature'])   
                document.write("날씨는"+data['description'])
            });
        </script>
    </body>
</html>
